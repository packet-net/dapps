name: ci

# Build and test, on every PR and every push to master. Nothing here publishes anything.
#
# Releasing is release.yml, triggered by a `v*` tag. The two are deliberately separate:
# this workflow used to cut a GitHub Release whenever a master push carried a bumped
# `<Version>`, which made "merge the PR" and "ship to every node" the same action. That
# stopped being acceptable once releases feed packet-net/apt and nodes upgrade from it.
#
# To release: bump `<Version>` in src/dapps/Directory.Build.props in the PR, merge, then
# tag the merge commit `v<that same version>` and push the tag. release.yml checks the two
# agree and refuses the release if they do not.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to a pull request cancels its older run. A master run is
# never cancelled: each merge gets a complete test pass, including the
# integration scenarios (#332). Later master pushes queue behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The unit tests on their own, so a broken one shows in a few minutes
  # rather than after the half-hour integration run. Everything that isn't
  # an integration test runs here, the soaks included (they skip
  # themselves unless DAPPS_SOAK_MINUTES asks for one).
  #
  # scripts/ci-test.py reruns only the tests that failed, never the whole
  # suite, and names every test that needed a rerun in the job summary and
  # in a warning on the run, so a flake is seen rather than absorbed (#331).
  # A test that fails all three times fails the job. A simulated-radio
  # scenario over its time target gets one rerun; over twice its target,
  # none (#352).
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/dapps/dapps.sln

      - name: Build
        run: dotnet build src/dapps/dapps.sln --no-restore --configuration Release

      - name: Unit tests
        run: >-
          scripts/ci-test.py "Unit tests" src/dapps/dapps.core.tests/bin/Release/net10.0/dapps.core.tests 3
          --filter-not-trait Category=Integration

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-results
          path: src/dapps/dapps.core.tests/bin/Release/net10.0/TestResults/
          if-no-files-found: ignore
          retention-days: 7

  # The integration tests: DAPPS daemons on real linbpq, XRouter and pdn
  # containers, and the simulated-radio scenarios on net-sim, which run in
  # real time. One pass takes about 30 minutes; 100 leaves room for the
  # pulls, the build and reruns of a few failed tests.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Pre-pull integration images
        # Integration tests spin up linbpq + xrouter containers.
        # Pulling here makes per-test startup deterministic; without it
        # the first integration test blocks on a docker pull and
        # sometimes trips its own timeout.
        run: |
          # linbpq, at the digest the tests pin.
          docker pull "$(grep -oE 'm0lte/linbpq@sha256:[0-9a-f]{64}' src/dapps/dapps.core.tests/Integration/LinbpqIntegrationFixture.cs)"
          docker pull "$(grep -oE 'ghcr\.io/packethacking/xrouter@sha256:[0-9a-f]{64}' src/dapps/dapps.core.tests/Integration/XrouterIntegrationFixture.cs)"
          # net-sim, for the simulated-radio scenarios, at the digest the tests pin.
          docker pull "$(grep -oE 'ghcr\.io/packet-net/net-sim@sha256:[0-9a-f]{64}' src/dapps/dapps.core.tests/Integration/NetSimFixtures.cs)"
          # pdn (packet.net), for the tests that run DAPPS on it, at the digest the tests pin.
          docker pull "$(grep -oE 'ghcr\.io/packet-net/packet\.net@sha256:[0-9a-f]{64}' src/dapps/dapps.core.tests/Integration/PdnFixtures.cs)"

      - name: Restore
        run: dotnet restore src/dapps/dapps.sln

      - name: Build
        run: dotnet build src/dapps/dapps.sln --no-restore --configuration Release

      - name: Integration tests
        # Same rules as the unit tests: only the failed tests rerun, and any
        # test that needed a rerun is named in the summary. A scenario over
        # its time target gets one rerun, over twice its target none.
        run: >-
          scripts/ci-test.py "Integration tests" src/dapps/dapps.core.tests/bin/Release/net10.0/dapps.core.tests 3
          --filter-trait Category=Integration


      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-test-results
          path: src/dapps/dapps.core.tests/bin/Release/net10.0/TestResults/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload scenario reports
        # Timings and air transcripts from the simulated-radio scenarios
        # (Kevin's WPS trace on AFSK 1200 and QPSK 3600), kept on every
        # run so a change's effect on air can be compared.
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scenario-reports
          path: src/dapps/dapps.core.tests/bin/Release/net10.0/scenario-reports/
          if-no-files-found: ignore
          retention-days: 30

  # UI tests live in dapps.core.uitests - they boot dapps.core as a
  # subprocess and drive Razor pages with headless Chromium via
  # Playwright. Separate job rather than rolled into `unit` because:
  # (1) Chromium install + browser deps are a noticeable slowdown the
  # unit tests shouldn't pay; (2) UI tests run as their own subprocess
  # so docker / port collisions are isolated.
  ui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore + build dapps.core.uitests
        run: |
          dotnet restore src/dapps/dapps.core.uitests/dapps.core.uitests.csproj
          dotnet build src/dapps/dapps.core.uitests/dapps.core.uitests.csproj --no-restore --configuration Release

      - name: Install Chromium + system deps
        # `--with-deps` apt-installs the libs Chromium needs (libnss3,
        # libxss1, etc.). Without this the browser launches but
        # immediately crashes on a missing-shared-library error.
        run: pwsh src/dapps/dapps.core.uitests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Pre-build dapps.core
        # WebAppFixture launches the already-built dll if present.
        # Pre-building here removes a race where the first test
        # triggers a build that takes longer than the 60s "Now
        # listening on" wait window. Configuration matches the test
        # build so LocateDappsBinary finds the dll on the first try.
        run: dotnet build src/dapps/dapps.core/dapps.core.csproj --configuration Release

      - name: Run UI tests
        # One attempt, as before, but through the same script so a failure
        # names its test in the job summary and the results are kept (#331).
        run: scripts/ci-test.py "UI tests" src/dapps/dapps.core.uitests/bin/Release/net10.0/dapps.core.uitests 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-test-results
          path: src/dapps/dapps.core.uitests/bin/Release/net10.0/TestResults/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload screenshots
        # Always upload - screenshots are useful both for failure
        # triage AND as a reference for "what does the UI look like
        # right now after this PR".
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-screenshots
          path: tests/screenshots/
          if-no-files-found: ignore
          retention-days: 14

  # The .deb build is part of the release, but a packaging break that only shows up when
  # someone tags is a release held hostage to a five-line shell bug. So build the amd64
  # package here too and actually install it. One architecture and no release plumbing,
  # so it finishes well inside the `integration` job it runs beside and costs nothing on the
  # critical path - and it catches the whole class, including the ones that only appear
  # at dpkg-configure time.
  deb:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build the amd64 .deb
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/dapps/Directory.Build.props | head -1)"
          packaging/build-deb.sh "$version" amd64 ./artifacts
          dpkg-deb --info ./artifacts/*.deb
          dpkg-deb --contents ./artifacts/*.deb | sed -n '1,40p'

      - name: Install it on every distro in scope
        # The runner is one Ubuntu release; operators run several. Depends names ICU by
        # versioned package, and when a new distro moved past the list apt refused the
        # package outright (#232, Ubuntu 26.04 and libicu78). So install into each clean
        # image and start the daemon there. `dapps --version` alone proves nothing here: it
        # exits before .NET loads ICU, so this waits for /Health to answer instead.
        timeout-minutes: 15
        run: |
          set -euo pipefail
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/dapps/Directory.Build.props | head -1)"
          for image in debian:bookworm debian:trixie ubuntu:22.04 ubuntu:24.04 ubuntu:26.04; do
            echo "::group::$image"
            docker run --rm -v "$PWD/artifacts:/a:ro" -e version="$version" "$image" bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq "/a/dapps_${version}_amd64.deb" curl >/dev/null
              dpkg -l | grep -o "libicu[0-9]*" | sort -u
              cd /tmp
              /usr/bin/dapps >/tmp/run.log 2>&1 &
              for i in $(seq 1 60); do
                curl -sS -o /tmp/health.json http://127.0.0.1:5000/Health 2>/dev/null && break
                sleep 1
              done
              grep -qF "$version" /tmp/health.json || { cat /tmp/run.log; exit 1; }
              cat /tmp/health.json; echo
            ' || { echo "::error::the package does not install and start on $image"; exit 1; }
            echo "::endgroup::"
          done

      - name: Install it and check it boots
        # Same smoke test release.yml runs, minus the version assertion against a tag.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/dapps/Directory.Build.props | head -1)"
          sudo apt-get update -qq
          sudo apt-get install -y "./artifacts/dapps_${version}_amd64.deb"
          /usr/bin/dapps --version
          for i in $(seq 1 60); do
            systemctl is-active --quiet dapps.service && break
            sleep 1
          done
          systemctl is-active --quiet dapps.service || {
            echo "::error::dapps.service did not reach active after a clean install"
            systemctl status dapps.service --no-pager || true
            journalctl -u dapps.service --no-pager -n 100 || true
            exit 1
          }
          # /Health answers 503 until a callsign and a node exist, which a fresh install
          # has neither of - so assert on the body, which carries the running version.
          for i in $(seq 1 60); do
            curl -sS -o /tmp/health.json http://127.0.0.1:5000/Health && break
            sleep 1
          done
          cat /tmp/health.json || true; echo
          grep -qF "$version" /tmp/health.json || {
            echo "::error::no usable HTTP listener on :5000 after a clean install"
            journalctl -u dapps.service --no-pager -n 100 || true
            exit 1
          }
          # Removal has to work too, and purge must not take the message database with it.
          #
          # `sudo test`, not `test`: the state directory is 0750 dapps:dapps
          # (StateDirectoryMode in the unit), so the unprivileged runner user cannot
          # traverse into it and a bare `test -e` reports the canary missing whether or not
          # purge touched it - which is exactly how this assertion first "failed". After
          # purge the dapps user is gone too, so the directory is owned by an orphaned uid
          # and still unreadable. Read it as root or do not read it at all.
          sudo touch /var/lib/dapps/canary
          sudo apt-get purge -y dapps
          sudo ls -la /var/lib/dapps/
          sudo test -e /var/lib/dapps/canary || {
            echo "::error::apt purge destroyed /var/lib/dapps - that is the message store"
            exit 1
          }
